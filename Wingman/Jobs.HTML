<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קצינויות</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body id="jobs-page">
    <header>
        <div class="profile-container header-section right-side">
            <div class="profile-button header-section">
                <button class="simple-button " id="profile-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                        class="bi bi-person-circle" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
                        <path fill-rule="evenodd"
                            d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
                    </svg>
                </button>
            </div>
            <div id="profileDropdown" class="profile-dropdown hidden">
                <span id="username-display" class="dropdown-content">username</span>
                <button id="logoutButton" class="simple-button dropdown-content">התנתק</button>
            </div>
        </div>
        <div class="header-section center-side">
            <img src="logo.png" id="logo" class="logo" alt="לוגו של האתר המטורף שלנו">
        </div>
        <div class="header-section left-side">
            <button type="button" class="button" onclick="goToMefekedPage()">מעבר לדף מפקד</button>
                  
        </div>
            
    </header>
    <div class="container">
        <h1>קצינויות</h1>
        <h2>עריכת קצינויות</h2>
        <div class="card-table">
            <table id="jobs-form">
                <thead>
                    <tr class="table-headers">
                        <th>כותרת הקצינויות</th>
                        <th>תיאור הקצינויות</th>
                        <th>אחריות אישית</th>
                        <th>סדר וארגון</th>
                        <th>יוזמה</th>
                        <th>יצרתיות</th>
                        <th>עבודה מול אנשים</th>
                        <th>עבודה מול גורמים פיקודיים</th>
                        <th>זמן השקעה שבועי</th>
                        <th>עמידה מול קהל</th>
                        <th>עבודת צוות</th>
                        <th>אסרטיביות</th>
                        <th>מנהיגות</th>
                        <th>תכנון קדימה</th>
                        <th>ערוך קצינות</th>
                        <th>הסר קצינות</th>
                    </tr>
                </thead>
                <tbody id="jobsTBody">
                    <!--יתווסף באמצעות js-->
                </tbody>
            </table>
        </div>
        <div class="add-job-form">
            <form>
                <h2>הוסף קצינות</h2>
                <label for="job-title">שם הקצינות:</label>
                <input type="text" id="job-title" name="job-title" required>
                <label for="job-description">תיאור הקצינות:</label>
                <textarea id="job-description" name="job-description" required></textarea>
                <label for="quailty1">אחריות אישית </label>
                <input type="number" id="quailty1" name="quailty1" min="1" max="10" required>
                <label for="quailty2">סדר וארגון </label>
                <input type="number" id="quailty2" name="quailty2" min="1" max="10" required>
                <label for="quailty3">יוזמה </label>
                <input type="number" id="quailty3" name="quailty3" min="1" max="10" required>
                <label for="quailty4">יצרתיות </label>
                <input type="number" id="quailty4" name="quailty4" min="1" max="10" required>
                <label for="quailty5">עבודה מול אנשים </label>
                <input type="number" id="quailty5" name="quailty5" min="1" max="10" required>
                <label for="quailty6">עבודה מול גורמים פיקודיים </label>
                <input type="number" id="quailty6" name="quailty6" min="1" max="10" required>
                <label for="quailty7">זמן השקעה שבועי </label>
                <input type="number" id="quailty7" name="quailty7" min="1" max="10" required>
                <label for="quailty8">עמידה מול קהל </label>
                <input type="number" id="quailty8" name="quailty8" min="1" max="10" required>
                <label for="quailty9">עבודת צוות </label>
                <input type="number" id="quailty9" name="quailty9" min="1" max="10" required>
                <label for="quailty10">אסרטיביות </label>
                <input type="number" id="quailty10" name="quailty10" min="1" max="10" required>
                <label for="quailty11">מנהיגות </label>
                <input type="number" id="quailty11" name="quailty11" min="1" max="10" required>
                <label for="quailty12">תכנון קדימה </label>
                <input type="number" id="quailty12" name="quailty12" min="1" max="10" required>
                <button type="submit">שמור קצינויות</button>
            </form>
        </div>
    </div>
    <script src="jobs.js"></script>
    <script src="header.js"></script>

</body>

</html>
