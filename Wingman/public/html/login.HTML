<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body id="login-page">
    <div class="container">
        <img src="../images/logo.png" id="logo" class="logo" alt="לוגו של האתר המטורף שלנו">
        <h1>התחברות</h1>
        <div id="newUser">
            <button id="goTosignup" style="font-size: 16px;">עדיין לא רשום? לחץ כאן להרשמה</button>
        </div><br>
        <form action="/login" method=post id="login">
            <label for="email">כתובת אימייל:</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            <label for="username">מספר אישי:</label><br>
            <input type="text" id="username" name="username" placeholder="1234567" required>
            <label for="password">סיסמה:</label><br>
            <input type="password" id="password" name="password" required>
            <button type="submit" form="login">התחבר</button>
        </form>
    </div>
    <script src="../js/login.js"></script>
</body>

</html>
